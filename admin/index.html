<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت ابر مینی‌اپ LandoGifts</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>🛠️ پنل مدیریت ارتقایافته LandoGifts</h1>

    <!-- 1. CREATE LEVEL 7 SPECIAL CARDS -->
    <div class="card">
        <h2>🔥 ساخت کارت ویژه لول ۷ (خاص)</h2>
        <input type="text" id="cTitle" placeholder="عنوان کارت">
        <input type="number" id="cPower" placeholder="قدرت کارت (مثلا 5000)">
        <input type="text" id="cImage" placeholder="لینک عکس کارت">
        <input type="number" id="cPrice" placeholder="قیمت در فروشگاه (🪙)">
        <button onclick="createLevel7Card()">ساخت کارت لول ۷</button>
    </div>

    <!-- 2. CREATE AUCTIONS -->
    <div class="card">
        <h2>🔨 شروع مزایده جدید</h2>
        <input type="number" id="aCardId" placeholder="شناسه کارت (Card ID)">
        <input type="number" id="aStartingBid" placeholder="قیمت پایه مزایده">
        <input type="number" id="aDuration" placeholder="مدت زمان (ساعت)">
        <button onclick="createAuction()">ایجاد مزایده</button>
    </div>

    <!-- 3. CONFIGURE LEADERBOARD REWARDS -->
    <div class="card">
        <h2>🏆 تنظیم جوایز لیدربورد</h2>
        <select id="lbCategory">
            <option value="SCORE">امتیاز بازی</option>
            <option value="LEVEL">سطح (Level)</option>
            <option value="CLAN">کلن‌ها</option>
        </select>
        <input type="number" id="lbRank" placeholder="رتبه (1 تا 10)">
        <select id="lbRewardType">
            <option value="coins">سکه</option>
            <option value="card">کارت اختصاصی</option>
        </select>
        <input type="text" id="lbRewardVal" placeholder="مقدار سکه یا آی‌دی کارت">
        <button onclick="saveLeaderboardReward()">ثبت جایزه رتبه</button>
    </div>

    <script>
        async function createLevel7Card() {
            const title = document.getElementById('cTitle').value;
            const power = document.getElementById('cPower').value;
            const imageUrl = document.getElementById('cImage').value;
            const price = document.getElementById('cPrice').value;

            const res = await fetch('/api/admin/cards/create-level7', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, power: parseInt(power), imageUrl, price: parseInt(price), isShopItem: 1 })
            }).then(r => r.json());

            alert(res.message || "کارت لول ۷ ساخته شد!");
        }

        async function createAuction() {
            const cardId = document.getElementById('aCardId').value;
            const startingBid = document.getElementById('aStartingBid').value;
            const durationHours = document.getElementById('aDuration').value;

            const res = await fetch('/api/admin/auctions/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cardId: parseInt(cardId), startingBid: parseInt(startingBid), durationHours: parseInt(durationHours) })
            }).then(r => r.json());

            alert(res.message || "مزایده فعال شد!");
        }

        async function saveLeaderboardReward() {
            const category = document.getElementById('lbCategory').value;
            const rank_position = document.getElementById('lbRank').value;
            const reward_type = document.getElementById('lbRewardType').value;
            const reward_value = document.getElementById('lbRewardVal').value;

            const res = await fetch('/api/admin/leaderboard-rewards', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ category, rank_position: parseInt(rank_position), reward_type, reward_value })
            }).then(r => r.json());

            alert(res.message || "تنظیمات جایزه لیدربورد ذخیره شد!");
        }
    </script>
</body>
</html>
